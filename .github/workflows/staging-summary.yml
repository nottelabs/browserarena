name: Staging Summary

# Daily Slack post: Notte staging (us-staging.notte.cc, 20:00/21:00 UTC runs)
# next to Notte production (04:00/06:00 UTC), in the regression-alert channel.
# Staging results live in the private nottelabs/browserarena-staging-results
# repo. This repo's Actions logs are public, so the script never prints them.

on:
  schedule:
    # After the 21:00 UTC staging throughput run (60-minute limit) publishes.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Staging run day to report, YYYY-MM-DD (default: today UTC)"
        required: false

permissions:
  contents: read

concurrency:
  group: staging-summary
  cancel-in-progress: false

jobs:
  post:
    # Forks have neither secret; only the upstream repo posts.
    if: github.repository == 'nottelabs/browserarena'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Post summary
        working-directory: web
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INTERNAL_RESULTS_GITHUB_TOKEN: ${{ secrets.STAGING_RESULTS_TOKEN }}
          DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${DATE:-}" ]; then
            if ! printf '%s' "$DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Invalid date (expected YYYY-MM-DD): $DATE" >&2
              exit 1
            fi
            args+=(--date "$DATE")
          fi
          npx tsx scripts/post-staging-summary.ts "${args[@]}"
